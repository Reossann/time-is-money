[package]
name = "time-is-money"
version = "0.1.0"
edition = "2021"

[lib]
name = "time_is_money"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.0"
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
serde_json = "1"
