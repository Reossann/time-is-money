[package]
name = "time-is-money"
version = "0.1.5"
edition = "2021"

[lib]
name = "time_is_money"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"

[dev-dependencies]
serde_json = "1"
